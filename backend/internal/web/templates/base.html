{{- define "base" -}}
<!doctype html>
<html lang="en" data-category="{{.Category}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.16/dist/plot.umd.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">WA</span> Winter Arc</a>
    <nav class="main-nav">
      <a href="/" class="{{if eq .Category ""}}active{{end}}">Overview</a>
      {{range .Categories}}
        <a href="/trends/{{.Key}}" class="{{if eq $.Category .Key}}active{{end}}">{{.Label}}</a>
      {{end}}
      <a href="/correlations" class="{{if eq .Category "correlations"}}active{{end}}">Correlations</a>
    </nav>
    {{template "synchealth" .}}
  </header>
  <main class="content">
    {{template "content" .}}
  </main>
  <footer class="site-footer">
    <span>Winter Arc — local-first, self-hosted</span>
    <span id="clock"></span>
  </footer>
  <script src="/static/js/app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/@mapbox/polyline@1.1.1/dist/polyline.js"></script>
  {{range .Scripts}}<script src="{{.}}" defer></script>
  {{end}}
</body>
</html>
{{- end -}}
