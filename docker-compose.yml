name: winterarc

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WINTERARC_DB_HOST: postgres
      WINTERARC_DB_PORT: "5432"
      WINTERARC_DB_USER: ${POSTGRES_USER}
      WINTERARC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      WINTERARC_DB_NAME: ${POSTGRES_DB}
      WINTERARC_LISTEN_ADDR: ":8080"
      WINTERARC_API_KEY: ${WINTERARC_API_KEY}
      WINTERARC_PLUMBER_URL: http://analysis:8002
      WINTERARC_BASE_URL: ${WINTERARC_BASE_URL}
      FATSECRET_KEY: ${FATSECRET_KEY}
      FATSECRET_SECRET: ${FATSECRET_SECRET}
      WINTERARC_SYNC_INTERVAL: ${WINTERARC_SYNC_INTERVAL:-1h}
    expose:
      - "8080"

  analysis:
    build: ./analysis
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    expose:
      - "8002"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8081"
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PGDATA_HOST_PATH}
  caddy_data:
  caddy_config: