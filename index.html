<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinterArc — Personal Health Observatory</title>
  <meta name="description" content="WinterArc is a desktop-first personal health, activity, recovery, sleep, nutrition and wellbeing observatory.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e4e6ea">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8660f' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' rx='6' fill='%231c1e22' stroke='none'/%3E%3Cpath d='M4 18l5.6-11 3.2 5.4 2.1-3.1L20 18z'/%3E%3Cpath d='M8 15h8'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loaded non-blocking: the dashboard must never wait on the font CDN -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">

  <script>
    /* set the theme before first paint so the shell never flashes */
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem("winterarc.v1") || "null");
        var theme = stored && stored.theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0b0c0e" : "#e4e6ea");
      } catch (e) { /* defaults are fine */ }
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="WinterArc navigation"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content" tabindex="-1">
        <div class="content__inner" id="page"></div>
      </main>
    </div>
  </div>

  <noscript>
    <div style="padding:40px;font:15px/1.6 system-ui;color:#14161a">
      WinterArc is a JavaScript application. Please enable JavaScript to open the observatory.
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
